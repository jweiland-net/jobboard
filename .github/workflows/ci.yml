name: Tests

on: [pull_request]

jobs:
  testing:
    name: Testing

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      matrix:
        php:
          - '8.2'
          - '8.3'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: 'Lint PHP'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s lint

      - name: 'Install testing system'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerUpdate

      - name: 'Composer validate'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerValidate

      - name: 'Composer normalize'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerNormalize -n

      - name: 'CGL'
        run: Build/Scripts/runTests.sh -b docker -n -p ${{ matrix.php }} -s cgl

      - name: 'Execute unit tests'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s unit

      - name: 'Execute functional tests with MariaDB'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -d mariadb -s functional

      # SQLite functional tests are intentionally not run in CI: the sqlite case in
      # runTests.sh mounts a tmpfs for typo3temp/var/tests/functional-sqlite-dbs/, which
      # fails every test with "unable to open database file" specifically under docker
      # (forced here via -b docker because of an unrelated podman/crun issue on this
      # runner) - not reproducible locally via ddev or a plain Docker Desktop repro, so
      # root-caused as GH Actions Linux docker-specific. Functional tests still run
      # against MariaDB and Postgres below. Revisit if/when podman works again on this
      # runner, or the tmpfs mount can be debugged directly on a Linux docker host.
      - name: 'Execute functional tests with Postgres'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -d postgres -s functional
