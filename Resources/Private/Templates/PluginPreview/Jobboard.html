<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<table class="table">
    <thead>
    <tr>
        <th>Config</th>
        <th>Value</th>
    </tr>
    </thead>

    <tbody>
    <tr>
        <td><strong>Plugin</strong></td>
        <td>Job Board</td>
    </tr>

    <tr>
        <td><strong>Show Search</strong></td>
        <td>
            <f:if condition="{pi_flexform_transformed.settings.showSearch}">
                <f:then>
                    <core:icon identifier="actions-check"/>
                </f:then>
                <f:else>
                    <core:icon identifier="actions-message-ok-close"/>
                </f:else>
            </f:if>
        </td>
    </tr>

    <f:if condition="{pi_flexform_transformed.settings.jobAreas}">
        <tr>
            <td><strong>Job Areas</strong></td>
            <td>{pi_flexform_transformed.settings.jobAreas}</td>
        </tr>
    </f:if>

    <f:if condition="{pi_flexform_transformed.settings.maxEntries}">
        <tr>
            <td><strong>Max Entries</strong></td>
            <td>{pi_flexform_transformed.settings.maxEntries}</td>
        </tr>
    </f:if>

    <tr>
        <td><strong>Is Internal</strong></td>
        <td>
            <f:if condition="{pi_flexform_transformed.settings.isInternal}">
                <f:then>
                    <core:icon identifier="actions-check"/>
                </f:then>
                <f:else>
                    <core:icon identifier="actions-message-ok-close"/>
                </f:else>
            </f:if>
        </td>
    </tr>
    </tbody>
</table>
</html>
