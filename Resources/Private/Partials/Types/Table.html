<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="table-responsive">
    <table class="jobboard-table table table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">{f:translate(key: 'job.title')}</th>
            <th scope="col">{f:translate(key: 'job.applicationDeadline')}</th>
            <th scope="col">{f:translate(key: 'job.address.zip')}</th>
            <th scope="col">{f:translate(key: 'job.address.city')}</th>
            <th scope="col">{f:translate(key: 'job.employer')}</th>
            <th scope="col">{f:translate(key: 'job.job_type.title')}</th>
            <th scope="col" class="text-center">{f:translate(key: 'remember')}</th>
        </tr>
        </thead>

        <tbody>
        <f:variable name="dateFormat" value="{f:translate(key: 'dateFormat')}"/>
        <f:for each="{objects}" as="job">
            <tr data-jobboard-uid="{job.uid}">
                <f:render partial="Job/TitleLink" arguments="{job: job}"/>
                <f:render partial="Types/Date" arguments="{value: job.applicationDeadline, format: dateFormat}"/>
                <f:render partial="Types/Text" arguments="{value: job.address.zip}"/>
                <f:render partial="Types/Text" arguments="{value: job.address.city}"/>
                <f:render partial="Types/Text" arguments="{value: job.employer}"/>
                <f:render partial="Types/Text" arguments="{value: job.jobType.title}"/>
                <td class="text-center"><input type="checkbox" class="form-check-input" name="remember_job" value="{job.uid}" aria-label="{f:translate(key: 'remember')} {job.title}"></td>
            </tr>
        </f:for>
        </tbody>
    </table>
</div>
</html>
