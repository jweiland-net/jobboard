<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{options}">
    <f:comment>
        The id is prefixed to keep the id "address" reserved for the zip/city
        textfield, which gets the suggestions of address-suggestions.js.
    </f:comment>
    <div class="mb-3">
        <label for="jobboard-{name}" class="form-label">{f:translate(key: '{label}')}</label>
        <f:form.select
            options="{options}"
            sortByOptionLabel="true"
            prependOptionLabel="{f:translate(key: 'fluid.select.prependOptionLabel')}"
            prependOptionValue="0"
            optionLabelField="title"
            optionValueField="uid"
            name="{name}"
            id="jobboard-{name}"
            class="form-select"
            value="{value}"/>
    </div>
</f:if>
</html>
