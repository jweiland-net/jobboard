<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{options}">
    <f:comment>
        The id is prefixed to keep the id "address" reserved for the zip/city
        textfield, which gets the suggestions of address-suggestions.js.
    </f:comment>
    <div class="jb:grid jb:gap-1.5">
        <label for="jobboard-{name}" class="jb:text-sm jb:font-medium jb:text-slate-700">{f:translate(key: '{label}')}</label>
        <f:form.select
            options="{options}"
            sortByOptionLabel="true"
            prependOptionLabel="{f:translate(key: 'fluid.select.prependOptionLabel')}"
            prependOptionValue="0"
            optionLabelField="title"
            optionValueField="uid"
            name="{name}"
            id="jobboard-{name}"
            class="jb:block jb:min-h-11 jb:w-full jb:rounded-xl jb:border jb:border-slate-300 jb:bg-white jb:px-3 jb:text-sm jb:text-slate-900 jb:shadow-xs jb:transition jb:hover:border-slate-400 jb:focus:border-brand-600 jb:focus:ring-3 jb:focus:ring-brand-100 jb:focus:outline-none"
            value="{value}"/>
    </div>
</f:if>
</html>
