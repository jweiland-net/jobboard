<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:jobboard="http://typo3.org/ns/JWeiland/Jobboard/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="grid">
    <div class="col-4_md-12">
        <f:if condition="{settings.showSearch}">
            <f:render partial="Job/Search" arguments="{_all}"/>
        </f:if>
    </div>

    <f:comment>
        The map needs the optional EXT:maps2. Without it, no job has a
        PoiCollection and the partial of EXT:maps2 is never rendered.
    </f:comment>
    <f:variable name="poiCollections" value="{jobboard:jobPoiCollection(jobs: jobs)}"/>
    <f:if condition="{poiCollections}">
        <div class="col-8_md-12 margin-bottom">
            <f:render partial="Maps2/PoiCollection"
                      section="showMap"
                      arguments="{poiCollections: poiCollections, override: '{settings: {mapWidth: \'100%\', mapHeight: \'400\', streetViewControl: 0}, extConf: {strokeColor: \'blue\'}}'}"/>
        </div>
    </f:if>
</div>
</html>
