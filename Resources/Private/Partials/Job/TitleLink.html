<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>Link to the job: external link or detail action. "class" is optional.</f:comment>
<f:if condition="{job.link}">
    <f:then>
        <f:link.external uri="{job.link}" target="_blank" class="{class}">{job.title}</f:link.external>
    </f:then>
    <f:else>
        <f:link.action action="detail" arguments="{job: job}" class="{class}">{job.title}</f:link.action>
    </f:else>
</f:if>
</html>
