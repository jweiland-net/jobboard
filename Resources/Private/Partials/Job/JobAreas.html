<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Renders the titles of all occupational fields (job areas) of a job, each
    wrapped in its own span tag. The spans are separated by a comma by default.
    Use argument "separator" to change it, e.g. separator: '' if the spans are
    separated by CSS only.
</f:comment>

<f:argument name="job" type="JWeiland\Jobboard\Domain\Model\Job"/>
<f:argument name="separator" type="string" optional="{true}" default=", "/>

<f:spaceless>
    <f:for each="{job.jobAreas}" as="jobArea" iteration="iterator"><span class="job-area jb:inline-flex jb:items-center jb:rounded-full jb:bg-brand-50 jb:px-2.5 jb:py-0.5 jb:text-xs jb:font-medium jb:text-brand-800 jb:ring-1 jb:ring-brand-200 jb:ring-inset">{jobArea.title}</span><f:if condition="{iterator.isLast}"><f:else>{separator}</f:else></f:if></f:for>
</f:spaceless>
</html>
