<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="search-jobboard">
    <fieldset>
        <legend class="fontsize3">{f:translate(key: 'search.label')}</legend>
        <f:comment>
            data-jobboard-address-search-url: endpoint for the zip/city
            suggestions of script.js (answered by AddressSearchMiddleware).
            Rendered as URL of the current page, so it always resolves to
            this site and language.
        </f:comment>
        <f:form action="search" data="{jobboard-address-search-url: '{f:uri.page()}'}">
            <f:render partial="Types/Select" arguments="{label: 'search.job_area', options: jobAreas, name: 'jobArea', value: selected_job_area}"/>
            <f:render partial="Types/Select" arguments="{label: 'search.job_role', options: jobRoles, name: 'jobRole', value: selected_job_role}"/>
            <f:render partial="Types/Select" arguments="{label: 'search.job_type', options: jobTypes, name: 'jobType', value: selected_job_type}"/>
            <f:if condition="{settings.addressSearchMode} == 'jobLocation'">
                <f:then>
                    <f:render partial="Types/Select" arguments="{label: 'search.job_location', options: jobLocations, name: 'address', value: selected_address}"/>
                </f:then>
                <f:else>
                    <f:render partial="Types/Textfield" arguments="{label: 'search.city_or_zip', name: 'address', value: selected_address}"/>
                </f:else>
            </f:if>
            <f:if condition="{settings.showFreeTextSearch}">
                <f:render partial="Types/Textfield" arguments="{label: 'search.search_word', name: 'searchWord', value: selected_search_word}"/>
            </f:if>
            <div class="form-group">
                <f:form.submit class="submit-btn" value="{f:translate(key: 'search.submit')}"/>
            </div>
        </f:form>
    </fieldset>
</div>
</html>
