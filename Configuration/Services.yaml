services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  JWeiland\Jobboard\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Restrictions and constraints, created with "new"
      - '../Classes/Database/Query/*'
      # Listens to an event of the optional EXT:maps2, see Services.php
      - '../Classes/EventListener/RenderJobLocationInfoWindowContentEventListener.php'

  JWeiland\Jobboard\ApiModel\ApiMapping:
    shared: false

  JWeiland\Jobboard\ApiModel\JobModel:
    shared: false

  JWeiland\Jobboard\ApiModel\LocationModel:
    shared: false

  JWeiland\Jobboard\Service\ImportService:
    arguments:
      $apiModels: !tagged api.model
