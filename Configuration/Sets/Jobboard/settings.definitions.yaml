categories:
  jobboard: {}
  jobboard.templates:
    parent: jobboard
  jobboard.pages:
    parent: jobboard
  jobboard.search:
    parent: jobboard
  jobboard.pageBrowser:
    parent: jobboard
  jobboard.salary:
    parent: jobboard

settings:
  jobboard.templateRootPath:
    category: jobboard.templates
    type: string
    default: 'EXT:jobboard/Resources/Private/Templates/'
  jobboard.partialRootPath:
    category: jobboard.templates
    type: string
    default: 'EXT:jobboard/Resources/Private/Partials/'
  jobboard.layoutRootPath:
    category: jobboard.templates
    type: string
    default: 'EXT:jobboard/Resources/Private/Layouts/'
  jobboard.storagePid:
    category: jobboard.pages
    type: string
    default: '0'
  jobboard.pidOfDetailPage:
    category: jobboard.pages
    type: page
    default: 0
  jobboard.pidOfApplicationForm:
    category: jobboard.pages
    type: page
    default: 0
  jobboard.showJobAreaCount:
    category: jobboard.search
    type: bool
    default: false
  jobboard.pageBrowser.enable:
    category: jobboard.pageBrowser
    type: bool
    default: true
  jobboard.pageBrowser.itemsPerPage:
    category: jobboard.pageBrowser
    type: int
    default: 15
  jobboard.salary.required:
    category: jobboard.salary
    type: bool
    default: true
  jobboard.salary.numberFormat:
    category: jobboard.salary
    type: string
    default: 'automatic'
    enum:
      automatic: 'Automatic (locale of the page)'
      custom: 'Custom (separators and currency position below)'
  jobboard.salary.currency:
    category: jobboard.salary
    type: string
    default: 'EUR'
    options:
      min: 3
      max: 3
  jobboard.salary.decimals:
    category: jobboard.salary
    type: int
    default: 2
    options:
      min: 0
      max: 4
  jobboard.salary.thousandsSeparator:
    category: jobboard.salary
    type: string
    default: ','
    options:
      max: 1
  jobboard.salary.decimalSeparator:
    category: jobboard.salary
    type: string
    default: '.'
    options:
      min: 1
      max: 1
  jobboard.salary.currencyPosition:
    category: jobboard.salary
    type: string
    default: 'after'
    enum:
      after: 'After the amount (1.234,56 €)'
      before: 'Before the amount (€ 1.234,56)'
