# Route enhancer for speaking URLs of the job detail view and the pages of
# the job list.
#
# Import this file in your site configuration (config/sites/<site>/config.yaml)
# or in any YAML file imported from there:
#
#   imports:
#     - { resource: 'EXT:jobboard/Configuration/Routes/Default.yaml' }
#
# Project-specific values can be added below the same enhancer key, e.g.:
#
#   routeEnhancers:
#     JobboardPlugin:
#       limitToPages: [123]
#
# Note: lists (like "limitToPages") of imported files are merged, not
# replaced. That's why this file does not define "limitToPages" itself.
routeEnhancers:
  JobboardPlugin:
    type: Extbase
    extension: Jobboard
    plugin: Jobboard
    routes:
      # Static route before '/{job_title}', so it is matched first
      -
        routePath: '/remembered'
        _controller: 'Jobboard::rememberedJobs'
      -
        routePath: '/{job_title}'
        _controller: 'Jobboard::detail'
        _arguments:
          job_title: job
      -
        routePath: '/page/{page}'
        _controller: 'Jobboard::list'
        _arguments:
          page: currentPage
    requirements:
      job_title: '^[[:alnum:]\-]+$'
      page: '\d+'
    defaultController: 'Jobboard::list'
    aspects:
      job_title:
        type: PersistedAliasMapper
        tableName: tx_jobboard_domain_model_job
        routeFieldName: path_segment
      page:
        type: StaticRangeMapper
        start: '1'
        end: '999'
